name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: node18-macos-x64
            artifact: wakem-t-macos
            binary: wakem-t-macos
          - os: ubuntu-latest
            target: node18-linux-x64
            artifact: wakem-t-linux
            binary: wakem-t-linux
          - os: windows-latest
            target: node18-win-x64
            artifact: wakem-t-windows
            binary: wakem-t-win.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          cd wakem-t
          npm install

      - name: Build
        run: |
          cd wakem-t
          npm run build

      - name: Package
        run: |
          cd wakem-t
          npx pkg . --targets ${{ matrix.target }} --output ${{ matrix.binary }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wakem-t/${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
